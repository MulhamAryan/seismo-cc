name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    name: Engine & guard smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure git identity (fixture needs it)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Syntax check every source file
        run: |
          for f in bin/impact.js hooks/impact-gate.js lib/*.js test/*.js; do
            node --check "$f"
          done

      - name: Run smoke tests
        run: bash test/smoke.sh
